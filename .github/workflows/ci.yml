name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions and Foundry libraries are pinned to commit SHAs (tag in the comment), not movable tags.
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      # forge-std v1.9.7, openzeppelin-contracts v5.4.0
      - run: forge install foundry-rs/forge-std@77041d2ce690e692d6e03cc812b57d1ddaa4d505 OpenZeppelin/openzeppelin-contracts@c64a1edb67b6e3f4a15cca8909c9482ad33a02b0 --no-git
      - run: forge test
      - run: forge build --sizes | grep RefractEngine

  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.13 }
      - run: cd sdk && bun install --frozen-lockfile
      - run: cd services && bun install --frozen-lockfile
      - run: cd services && bun run typecheck
      - run: cd services && bun test
      - name: api/ holds exactly the bundles build:api produces, up to date
        run: |
          cd services && bun run build:api && cd ..
          git status --porcelain -- api > api.status
          test ! -s api.status || { echo "api/ is stale or has files build:api does not produce:"; cat api.status; exit 1; }
          test "$(ls api | sort | tr '\n' ' ')" = "mcp.js telegram-link.js telegram.js " || { echo "unexpected files in api/:"; ls api; exit 1; }

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
